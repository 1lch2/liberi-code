path_base: repository-root
scope: >-
  覆盖当前 CLI 的启动与本地构建、Agent 对话与工具循环、模型接口适配、
  Provider 连接、Agent 设置、终端交互、文件读写、命令执行、网页抓取及 GitHub Release 发布主链路。内容基于源码核对，用于定位实现，
  不代表真实模型端点、终端或跨平台行为已经运行验收。
not_yet_mapped:
  - VSCode 调试配置
  - 网页搜索与远程网页读取（Playwright、Tavily、Jina 等，以及 MCP 客户端）
features:
  - id: release
    name: GitHub Actions 发布、安装包与 Release Notes
    keywords: [GitHub Actions, release, tag, feat, fix, 发布说明, release notes, npm pack]
    doc: docs/features/release.md
    entrypoints: [.github/workflows/release.yml, scripts/release-notes.mjs]
  - id: cli-startup
    name: CLI 启动、本地构建与开发检查
    keywords:
      [
        启动,
        配置,
        无环境变量,
        npm,
        build,
        liberi-code,
        commitlint,
        Conventional Commits,
        Husky,
        Prettier,
        format,
        Codex,
        hook,
      ]
    doc: docs/features/cli-startup.md
    entrypoints: [src/index.tsx, package.json, scripts/build.mjs]
  - id: agent-loop
    name: Agent 对话历史、工具循环与系统提示词
    keywords:
      [
        Agent,
        BaseAgent,
        MainAgent,
        send,
        ReAct,
        对话,
        上下文,
        compact,
        上下文压缩,
        history XML,
        工具调用,
        AgentUpdate,
        系统提示词,
        buildSystemPrompt,
        buildToolsPrompt,
        buildSkillsPrompt,
        AGENTS.md,
        全局指令,
        skill,
        skills,
        SKILL.md,
        frontmatter,
        渐进加载,
      ]
    doc: docs/features/agent-loop.md
    entrypoints: [src/core/agent.ts, src/core/compact.ts, src/core/prompt.ts, src/core/skills.ts]
  - id: model-adapter
    name: OpenAI 兼容模型接口与 Token 用量
    keywords:
      [
        OpenAILLM,
        LLM,
        Chat Completions,
        模型,
        ModelInfo,
        contextWindow,
        上下文长度,
        非流式,
        token,
        TokenUsage,
        cached_tokens,
        缓存命中,
        协议转换,
      ]
    doc: docs/features/model-adapter.md
    entrypoints: [src/openai-llm.ts, src/types.ts]
  - id: providers
